name: Auto Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK after push
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew -not -path './.git/*' -not -path '*/build/*' -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            {
              echo "## APK build not started"
              echo
              echo "This repository currently has no Gradle wrapper (gradlew), so it is not yet an Android Gradle application."
              echo "Add/import the Android app project and its Gradle wrapper to enable APK generation."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No gradlew found; no APK can be generated from this repository yet."
            exit 0
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project at: $PROJECT_DIR"

      - name: Set up Java
        if: steps.locate.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        if: steps.locate.outputs.found == 'true'
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        if: steps.locate.outputs.found == 'true'
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        if: steps.locate.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AUTOCRAFT-3D-AI-debug-apk-${{ github.sha }}
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
