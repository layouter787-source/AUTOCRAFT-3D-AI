name: AutoCraft3D Android Foundation

on:
  push:
    branches:
      - autocraft/android-porting-foundation
    paths:
      - "android-app/**"
      - ".github/workflows/autocraft-android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/autocraft-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: autocraft3d-debug-arm64
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
